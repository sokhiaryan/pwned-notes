<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>html2pdf</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>html2pdf</h1>
    <p class="subtitle">Render a web page as a PDF</p>

    {% if error %}
      <div class="alert">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('convert') }}" method="post">
      <div class="field">
        <label for="url">Page address</label>
        <input
          type="url"
          id="url"
          name="url"
          placeholder="https://example.com"
          pattern="https?://.+"
          title="URL must start with http:// or https://"
          autocomplete="off"
          required
        >
      </div>

      <button type="submit" class="submit-btn">Generate PDF</button>
    </form>
  </main>
</body>
</html>
